{% extends "admin/change_form.html" %}
{% load i18n %}

{% block submit_buttons_bottom %}
    {{ block.super }}
    {% if login_as_url %}
        <div class="submit-row" style="background:#fff3cd; border:1px solid #ffe69c; margin-top:10px;">
            <span style="margin-right:auto; color:#856404;">
                {% trans "Sesión como este usuario en el frontend:" %}
            </span>
            <a href="{{ login_as_url }}"
               class="button"
               style="background:#0c5460; color:#fff; padding:8px 14px; border-radius:4px; text-decoration:none;"
               onclick="return confirm('{% trans 'Iniciarás sesión en la app como este usuario. ¿Continuar?' %}');">
                🔐 {% trans "Iniciar sesión como este usuario" %}
            </a>
        </div>
    {% endif %}
{% endblock %}
